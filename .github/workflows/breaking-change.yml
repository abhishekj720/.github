# Shared, reusable breaking-change PR reminder.
#
# A PR is treated as breaking if EITHER:
#   - its title carries the Conventional Commits breaking marker (e.g. feat(x)!: ...), or
#   - it changes any of the caller-supplied `paths` globs.
# When breaking, the PR description must contain the checklist sections; otherwise
# the check fails and prints the template to copy.
#
# Runs on all PRs (not a paths-filtered trigger) so the title `!` marker is caught
# even when no watched path changed. Callers pass their watched paths as input.
#
# Caller example (.github/workflows/breaking_change_reminder.yml in a repo):
#
#   name: Breaking Change Reminder
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     breaking-change:
#       # A called workflow can only downgrade the caller's token, never elevate
#       # it. Repos created after 2023-02-02 default to a read-only token with
#       # pull-requests: none, so the caller must grant these or `gh pr view`
#       # (and watched-path checkout) fail.
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: cadence-workflow/.github/.github/workflows/breaking-change.yml@v1
#       with:
#         paths: |
#           schema/**
#           client/**/interface.go
name: Breaking Change Reminder (reusable)

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Newline-separated globs. A change to any of them marks the PR as
          breaking. Leave empty to rely solely on the Conventional Commits
          '!' title marker.
        type: string
        default: ""
      checklist:
        description: Comma-separated PR-body section headings that must be present.
        type: string
        default: "Detailed Description,Impact Analysis,Testing Plan,Rollout Plan"
      template-path:
        description: >-
          Optional path, in the CALLER repo, to a custom reminder template.
          Falls back to the built-in default when empty or missing.
        type: string
        default: ""

jobs:
  breaking-change-reminder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout caller repo
        # Only needed for watched-path diffing and reading a custom template.
        # Title-only mode (no inputs) skips the full-history clone entirely.
        if: inputs.paths != '' || inputs['template-path'] != ''
        uses: actions/checkout@v4
        with:
          # Full history so watched-path detection can diff base...head.
          fetch-depth: 0

      - name: Detect breaking change and require template
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WATCH_PATHS: ${{ inputs.paths }}
          CHECKLIST: ${{ inputs.checklist }}
          TEMPLATE_PATH: ${{ inputs.template-path }}
          # Default reminder template. Kept in an env block scalar (not a heredoc
          # inside `run`) so YAML handles the multiline indentation cleanly.
          DEFAULT_TEMPLATE: |
            ## Detailed Description
            <!-- In-depth description of the interface changes: new, removed, or modified fields. -->

            ## Impact Analysis
            - **Backward Compatibility:**
            - **Forward Compatibility:**

            ## Testing Plan
            - **Unit Tests:**
            - **Persistence Tests:**
            - **Integration Tests:**
            - **Compatibility Tests:**

            ## Rollout Plan
            - What is the rollout plan?
            - Does the order of deployment matter?
            - Is it safe to rollback? Is there a kill switch to mitigate impact immediately?
        run: |
          set -euo pipefail

          breaking=0
          reason=""

          # 1) Conventional Commits breaking marker in the PR title: type(scope)!: ...
          bang_re='^[a-zA-Z]+(\([^)]*\))?!:'
          if [[ "$PR_TITLE" =~ $bang_re ]]; then
            breaking=1
            reason="title carries the Conventional Commits '!' breaking marker"
          fi

          # 2) Watched-path change, glob-matched via git's own pathspec engine.
          if [[ "$breaking" -eq 0 && -n "${WATCH_PATHS//[$'\n\r\t ']/}" ]]; then
            pathspecs=()
            while IFS= read -r glob; do
              glob="$(echo "$glob" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -z "$glob" ]] && continue
              pathspecs+=(":(glob)$glob")
            done <<< "$WATCH_PATHS"
            if [[ ${#pathspecs[@]} -gt 0 ]]; then
              # Three-dot (merge-base) form: count only changes the PR introduced,
              # not commits that landed on the base branch after the fork point.
              # Fail loudly on a git error rather than masking it as "no change".
              if ! changed="$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- "${pathspecs[@]}")"; then
                echo "::error::git diff failed for watched-path detection (base=$BASE_SHA head=$HEAD_SHA)"
                exit 1
              fi
              if [[ -n "$changed" ]]; then
                breaking=1
                reason="changed watched path(s): $(echo "$changed" | tr '\n' ' ')"
              fi
            fi
          fi

          if [[ "$breaking" -eq 0 ]]; then
            echo "No breaking-change signal (no '!' in title, no watched path changed)."
            exit 0
          fi
          echo "Breaking change detected: $reason"

          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"

          print_template() {
            if [[ -n "$TEMPLATE_PATH" && -f "$TEMPLATE_PATH" ]]; then
              cat "$TEMPLATE_PATH"
            else
              printf '%s\n' "$DEFAULT_TEMPLATE"
            fi
          }

          missing=()
          old_ifs="$IFS"; IFS=','
          for raw in $CHECKLIST; do
            item="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [[ -z "$item" ]] && continue
            if [[ "$body" != *"$item"* ]]; then
              missing+=("$item")
            fi
          done
          IFS="$old_ifs"

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Breaking change detected ($reason) but the PR description is missing: ${missing[*]}"
            echo "Please add the following sections to your PR description:"
            echo "---"
            print_template
            echo "---"
            exit 1
          fi

          echo "All required breaking-change sections are present."
